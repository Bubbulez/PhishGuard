# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
services:
  - type: web
    name: phishguard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: echo "no dependencies"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false        # Render asks you for the value; it is never stored in the repo
      - key: VIRUSTOTAL_KEY
        sync: false
      - key: VIRUSTOTAL_PER_MIN
        value: "4"
