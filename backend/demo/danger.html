<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Riverside State — Sign in</title>
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI",Inter,sans-serif;background:#F4F2ED;color:#15181E}
  .demo{background:#15181E;color:#fff;font-size:12px;padding:6px 16px;letter-spacing:.04em}
  main{max-width:380px;margin:70px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  h1{font-size:22px;margin:0 0 18px} label{display:block;font-size:13px;margin:12px 0 4px;color:#3b3f47}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #D9D6CF;border-radius:8px;font-size:14px}
  button{margin-top:18px;width:100%;background:#2457A6;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:600}
</style></head>
<body>
  <div class="demo">PHISHGUARD DEMO PAGE · fictional school · nothing you type is sent anywhere</div>
  <main>
    <h1>Riverside State sign in</h1>
    <!-- action points at another domain on purpose: PhishGuard flags "login form posting to another domain" -->
    <form action="https://collect-riverside-login.net/submit" method="post" onsubmit="event.preventDefault();alert('Demo only — nothing was sent.')">
      <label>Student email</label><input type="email" name="email" placeholder="you@riverside.edu">
      <label>Password</label><input type="password" name="password">
      <button>Sign in</button>
    </form>
  </main>
</body></html>
